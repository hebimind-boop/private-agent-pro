name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrivateAgent-v1.0.3-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/PrivateAgent-v1.0.3-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.3' }}
          name: "PrivateAgent Pro v1.0.3 - Claude UI & Multi-Model Overhaul"
          body: |
            ### PrivateAgent Pro v1.0.3
            - **Claude AI-Style Chat Dock**: Unified card container with rounded attachment thumbnails and interactive model selector pill.
            - **Multi-Model Provider Hub**: Instant runtime switching between NVIDIA NIM, DeepSeek, Groq, Ollama, and OpenAI.
            - **In-Bubble Thinking Animation**: Sleek pulsating 3-dot wave with inline stop button.
            - **Multimodal Image Viewer**: Fullscreen pan & pinch-to-zoom for user image attachments.
            - **In-App Auto-Updater**: Background update check and seamless APK installer.
            - **OLED Monochrome Theme**: High-contrast SnackBar and toast styling.

            #### Direct Download
            Download **PrivateAgent-v1.0.3-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
