name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrivateAgent-v1.0.6-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/PrivateAgent-v1.0.6-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.6' }}
          name: "PrivateAgent Pro v1.0.6 - Full-Size APK Stream & Silent Shizuku Auto-Installer"
          body: |
            ### PrivateAgent Pro v1.0.6
            - **Exact Asset Targeting & Full APK Stream**: Explicitly targets the full universal `PrivateAgent-*-pro.apk` (~58.8 MB) instead of partial architecture splits, with multi-hop HTTP 301/302 redirect auto-following.
            - **Public Downloads Persistence**: Downloads directly to `/storage/emulated/0/Download/PrivateAgent-v1.0.6-pro.apk` with guaranteed stream buffer flushing prior to handoff.
            - **Zero-Click Silent Auto-Installation (Shizuku)**: Automated background installation via privileged `pm install -r -d` and immediate silent restart without user prompts when Shizuku is granted.
            - **PackageInstaller Fallback**: FileProvider `ACTION_VIEW` intent with `ACTION_MANAGE_UNKNOWN_APP_SOURCES` permission handling for non-Shizuku environments.

            #### Direct Download
            Download **PrivateAgent-v1.0.6-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
