name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BoopAgent-v1.0.13-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/BoopAgent-v1.0.13-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.13' }}
          name: "BoopAgent Pro v1.0.13 - Sleek Terminal Onboarding, Rebrand & Strict B&W Monochrome"
          body: |
            ### BoopAgent Pro v1.0.13
            - **Complete Brand Evolution**: Rebranded from PrivateAgent to **BoopAgent Pro** across the system manifest, application headers, drawer, system channels, and notifications.
            - **Streamlined TopBar Action**: Replaced the top settings gear with a crisp "New Chat" icon button for immediate fresh session creation; Settings accessible via the sidebar drawer.
            - **Settings Decluttering**: Purged the "Tuning & Boundaries" section to keep the UI clean while enforcing optimal production-grade defaults (temperature 0.7, max steps 15, context limit 4096).
            - **Radical Terminal Setup Onboarding**: Rebuilt onboarding as a sleek 3-step cybernetic terminal setup:
              - Monolithic branding with typing subtitle.
              - Interactive permission grid with real-time status badges.
              - Monochrome neural engine selector (NVIDIA, DeepSeek, Groq, Ollama) with monospace API key input.
            - **Strict B&W Light & Dark Themes**: Completely eradicated purple/blue accents across all buttons and controls in favor of pure high-contrast monochrome design.

            #### Direct Download
            Download **BoopAgent-v1.0.13-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
