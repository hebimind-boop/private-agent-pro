name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrivateAgent-v1.0.11-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/PrivateAgent-v1.0.11-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.11' }}
          name: "PrivateAgent Pro v1.0.11 - Floating Bubble Intent Routing & Native Lifecycle Resilience"
          body: |
            ### PrivateAgent Pro v1.0.11
            - **Strict Intent Routing (`AgentOrchestrator`)**: Strict intent classifier separating casual conversation (greetings, queries, coding) from device automation commands. Conversational inputs route directly to pure LLM streaming chat without touching the accessibility bridge or opening random apps.
            - **Floating Overlay Mode Switch**: Segmented OLED `[Chat]` / `[Agent]` toggle in the floating bubble matching the main interface with responsive hint placeholders.
            - **Service Lifecycle Resilience**: Native `FloatingOverlayService` implements `onStartCommand()` returning `START_NOT_STICKY`, immediate `startForeground()` on channel `floating_bubble_service` (Importance LOW) before WindowManager calls, and overlay permission pre-checks.
            - **Lag-Free Drag & Edge Snapping**: Throttled WindowManager layout updates to 16ms (60fps) during touch move events to prevent IPC saturation, with smooth `ValueAnimator` edge snapping on touch release.

            #### Direct Download
            Download **PrivateAgent-v1.0.11-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
