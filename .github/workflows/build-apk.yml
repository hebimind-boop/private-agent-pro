name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrivateAgent-v1.0.12-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/PrivateAgent-v1.0.12-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.12' }}
          name: "PrivateAgent Pro v1.0.12 - Unified Zero-Toggle AI Interface & Single-Stream Intent Routing"
          body: |
            ### PrivateAgent Pro v1.0.12
            - **Unified AI Interface (Zero-Toggle)**: Completely eliminated manual `[Chat | Agent]` mode toggle pills from both the main app (`HomeScreen`) and Floating Bubble (`OverlayApp`).
            - **Transparent Single-Stream Intent Routing**: All user inputs go through automatic intent classification via `AgentOrchestrator`:
              - Conversational / informational prompts (greetings, general Q&A, coding, brainstorming) stream directly from the LLM without touching device accessibility or opening apps.
              - Device action prompts (e.g., "open youtube", "set volume to 80%", "read screen", "send message") route directly to `TaskExecutor` with clean inline execution badges (`[EXECUTING TASK]`) and native system controls.
            - **Universal Input Dock**: Seamless "Type a prompt or task..." universal placeholder across both main and overlay interfaces.
            - **Clean Minimal OLED Monochrome UI**: Top app bar streamlined to Title, Session Reset, and Settings icon in pure high-contrast OLED monochrome styling.

            #### Direct Download
            Download **PrivateAgent-v1.0.12-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
