name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrivateAgent-v1.0.4-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/PrivateAgent-v1.0.4-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.4' }}
          name: "PrivateAgent Pro v1.0.4 - Telegram-Style Smart OTA Updater"
          body: |
            ### PrivateAgent Pro v1.0.4
            - **Telegram-Style Smart OTA Updater**: Public storage persistence (`/storage/emulated/0/Download/PrivateAgent-1.0.4.apk`) and live progress tracking.
            - **Autonomous Dual-Mode Installation**:
              - *Mode 1 (Shizuku)*: 100% silent privileged background installation and automatic application restart.
              - *Mode 2 (FileProvider)*: Standard high-reliability Android FileProvider content URI installation.
              - *Mode 3 (Accessibility Assistant)*: Autonomous click-through for native Android package installer.
            - **Claude AI-Style Chat Dock**: Unified container with rounded attachment thumbnails and multi-model selector pill.
            - **Pure OLED Black & White**: High-contrast theme with crisp floating SnackBars.

            #### Direct Download
            Download **PrivateAgent-v1.0.4-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
