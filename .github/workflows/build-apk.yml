name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrivateAgent-v1.0.5-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/PrivateAgent-v1.0.5-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.5' }}
          name: "PrivateAgent Pro v1.0.5 - Telegram-Spec PackageInstaller Overhaul"
          body: |
            ### PrivateAgent Pro v1.0.5
            - **Telegram-Spec PackageInstaller Overhaul**: Standard Android FileProvider intent (`ACTION_VIEW`, `FLAG_GRANT_READ_URI_PERMISSION`, `FLAG_ACTIVITY_NEW_TASK`) with automatic `ACTION_MANAGE_UNKNOWN_APP_SOURCES` permission handling.
            - **Cleaned Settings & Branding**: Minimal About PrivateAgent section pointing directly to `https://github.com/hebimind-boop/private-agent-pro`.
            - **Live Linear Download Progress**: Real-time percentage indicator with immediate native installer launch upon completion.
            - **Privileged Shizuku Silent Mode**: 100% silent background installation and graceful restart when Shizuku is granted.
            - **Consistent Keystore Signing**: Debug keystore signing enforced across CI release builds for seamless OTA updates.

            #### Direct Download
            Download **PrivateAgent-v1.0.5-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
