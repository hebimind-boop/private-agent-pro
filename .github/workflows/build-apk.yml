name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrivateAgent-v1.0.10-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/PrivateAgent-v1.0.10-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.10' }}
          name: "PrivateAgent Pro v1.0.10 - OLED Cyberpunk Onboarding & Floating Bubble Master Lifecycle"
          body: |
            ### PrivateAgent Pro v1.0.10
            - **OLED Monochrome Cyberpunk Onboarding**: Completely overhauled `OnboardingScreen` into Pure OLED Black (`#000000`) with high-contrast monochrome typography, segmented dashes progress indicator, and cybernetic glyphs.
            - **Floating Assistant Bubble Master Lifecycle**: Dedicated Master Switch toggle in Home and Settings screens persisting state (`isFloatingBubbleEnabled`) with synchronized native WindowManager lifecycle (`FLAG_NOT_FOCUSABLE`).
            - **Neural Engine Provider Cards**: Quick setup tiles for NVIDIA NIM, DeepSeek, Groq, and Ollama with high-contrast active borders and clean monospace field styling.
            - **Native Service Isolation**: Added native `FloatingOverlayService` with drag-to-move and tap-to-focus capabilities, cleanly registered in `AndroidManifest.xml`.

            #### Direct Download
            Download **PrivateAgent-v1.0.10-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
