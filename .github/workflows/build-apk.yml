name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrivateAgent-v1.0.7-pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/PrivateAgent-v1.0.7-pro.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.7' }}
          name: "PrivateAgent Pro v1.0.7 - Telegram-Spec Silent PackageInstaller Session"
          body: |
            ### PrivateAgent Pro v1.0.7
            - **Telegram-Spec Native PackageInstaller Session**: Direct streaming session to Android's `PackageInstaller` with `USER_ACTION_NOT_REQUIRED` on Android 12+ (API 31+) for near-zero-click background updates.
            - **Dynamic Version Binding**: Runtime resolution from Android `PackageManager` bound to Software Updates card and SnackBars (`Current Version: v${packageInfo.version}`).
            - **Autonomous Three-Tier Installation Pipeline**:
              - *Mode 1 (Privileged Shizuku)*: 100% silent zero-click background update and auto-restart.
              - *Mode 2 (Native PackageInstaller Session)*: Telegram-grade session install without manual file intent dialogs.
              - *Mode 3 (FileProvider Fallback)*: Standard `ACTION_VIEW` intent with unknown apps permission handling.
            - **Full-Size Universal APK Streaming**: Multi-hop HTTP redirect auto-following to persistent public storage (`/storage/emulated/0/Download/PrivateAgent-v1.0.7-pro.apk`).

            #### Direct Download
            Download **PrivateAgent-v1.0.7-pro.apk** below to install or update.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
